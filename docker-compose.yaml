services:
  # ─── Infrastructure ─────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: oauth_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: auth_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Auth Service ─────────────────────────────────────────────────
  auth:
    build:
      context: ./authentication
      dockerfile: Dockerfile
    container_name: oauth_auth
    restart: unless-stopped
    # In rootless Podman, uid 0 inside the container maps to the host invoking user,
    # so it can read key files owned by that user. Safe in rootless mode.
    user: "0"
    ports:
      - "8081:8081"
    volumes:
      - ./authentication/keys:/app/keys:ro,z
    environment:
      MONGO_URI: mongodb://mongo:27017/auth_db
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

  # ─── Backend API ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oauth_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_JWKS_URL: http://auth:8081
      FRONTEND_URL: http://localhost:3000
    depends_on:
      auth:
        condition: service_started

  # ─── Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AUTH_URL: http://localhost:8081
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: oauth_frontend
    restart: unless-stopped
    ports:
      # Using 3001 to avoid conflict when the Next.js dev server runs on 3000.
      # Change to "3000:3000" if running Docker-only (no local dev server).
      - "3001:3000"
    depends_on:
      - backend
      - auth

volumes:
  mongo_data:
